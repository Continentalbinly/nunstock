name: Deploy NunStock to Kham

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nunstock-production-deploy
  cancel-in-progress: false

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Verify backend
        working-directory: backend
        run: npm ci && npx prisma generate && npm run type-check && npm test

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Deploy exact main commit through the restricted release key
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_HOST_KEY: ${{ secrets.VPS_SSH_HOST_KEY }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          umask 077
          ssh_dir=$(mktemp -d "$RUNNER_TEMP/nunstock-ssh.XXXXXX")
          trap 'rm -rf "$ssh_dir"' EXIT
          printf '%s\n' "$VPS_SSH_KEY" > "$ssh_dir/key"
          printf '%s %s\n' "$VPS_HOST" "$VPS_SSH_HOST_KEY" > "$ssh_dir/known_hosts"
          ssh -i "$ssh_dir/key" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$ssh_dir/known_hosts" -o ServerAliveInterval=20 \
            "$VPS_USER@$VPS_HOST" "deploy $GITHUB_SHA"
